[project]
name = "invoice2go-mcp"
version = "1.1.0"
description = "Connect Invoice2go to Claude Code, ChatGPT and any AI agent through Cotlet.dev, a hosted MCP server. No Invoice2go API key needed."
readme = "README.md"
license = "Elastic-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Cotlet.dev", email = "contact@cotlet.dev" }]
keywords = ["invoice2go", "invoice2go api", "invoice2go mcp", "mcp server", "claude", "chatgpt", "ai agent", "cotlet"]
classifiers = ["Programming Language :: Python :: 3", "Topic :: Office/Business"]
dependencies = []

[project.urls]
Homepage = "https://cotlet.dev/integrations/invoice2go-api-mcp-server?utm_source=pypi&utm_medium=package&utm_campaign=invoice2go"
Source = "https://github.com/cotlet-connect/invoice2go-mcp"

[project.scripts]
invoice2go-mcp = "invoice2go_agent:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel.force-include]
"invoice2go_agent.py" = "invoice2go_agent.py"

[tool.hatch.build.targets.sdist]
include = ["invoice2go_agent.py", "README.md", "LICENSE", "mcp.json", "Dockerfile", "glama.json", "skills", "examples", ".cursor"]
